---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ mgmt_web_dir }}"
    state: directory
    mode: "0750"

- name: Render .env (secrets)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mgmt_web_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: Restart mgmt stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mgmt_web_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart mgmt stack

- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ mgmt_web_dir }}"
    state: present
    build: "{{ 'always' if mgmt_web_source | length > 0 else 'never' }}"
    pull: "{{ 'never' if mgmt_web_source | length > 0 else 'missing' }}"
  when: mgmt_web_start | bool
