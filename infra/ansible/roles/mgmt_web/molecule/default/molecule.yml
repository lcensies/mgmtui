---
# Tests the role in an isolated, systemd-capable container (docker-in-docker):
# the role installs Docker inside it and brings a stub stack up, so the
# deployment mechanics are exercised without building the real Rust image.
#
#   pipx install molecule 'molecule-plugins[docker]' ansible-core
#   cd infra/ansible/roles/mgmt_web && molecule test
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: mgmt-web-instance
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
