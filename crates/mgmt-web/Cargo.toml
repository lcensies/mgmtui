[package]
name = "mgmt-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP/JSON API + PWA host for mgmt (wraps MgmtContext behind axum)"

[features]
default = []
# Embed the built web/dist SPA into the binary (requires web/dist to exist at build time).
embed-ui = ["dep:rust-embed"]

[dependencies]
mgmt-core.workspace = true
mgmt-domain.workspace = true
mgmt-config.workspace = true
mgmt-store.workspace = true
mgmt-service.workspace = true
mgmt-dav.workspace = true
mgmt-google.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
notify.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }
axum = "0.7"
axum-login = "0.16"
tower-sessions = "0.13"
async-trait = "0.1"
time = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
rust-embed = { version = "8", optional = true }
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
data-encoding = "2"
rand = "0.8"
serde_yaml = "0.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tempfile.workspace = true
