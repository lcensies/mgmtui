[package]
name = "mgmt-google"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Google OAuth2 (via the `oauth2` crate) + Meet creation for mgmt — a refresh-token-based blocking facade shared by the CalDAV sync (bearer), the CLI, and the web Connect flow."

[dependencies]
mgmt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
reqwest = { workspace = true, features = ["json"] }
oauth2 = "5"

[dev-dependencies]
tempfile.workspace = true
